name: LARA Workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install and test the simulation and Workbench
        run: python bootstrap.py --test
      - name: Contact-physics scenarios
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          .venv/bin/python tools/validate.py
          .venv/bin/python tools/validate_objects.py
          .venv/bin/python tools/validate_controls.py
      - name: Build the Vercel site
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: node web/build.mjs
      - name: Render a Prompt2Robo replay with OSMesa
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
          OPENBLAS_NUM_THREADS: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6
          .venv/bin/python -m stacklab prompt2robo replay --id bse-drop_onto_cube-000 --video --output runs/ci-replay
          .venv/bin/python - <<'PY'
          import imageio.v2 as imageio
          with imageio.get_reader('runs/ci-replay/bse-drop_onto_cube-000.mp4') as video:
              frame = video.get_data(0)
              assert frame.shape == (720, 960, 3) and frame.std() > 1
          PY
  cuda-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    env:
      STACKLAB_CUDA_RUNTIME: source
      LD_LIBRARY_PATH: /usr/local/cuda/lib64/stubs:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
      LDFLAGS: -Wl,-rpath-link,/usr/local/cuda/lib64/stubs
    steps:
      - uses: actions/checkout@v7
      - name: Install source-build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git cmake python3 g++
          ln -sf libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
      - name: Compile the pinned runtime for A100 and L4
        run: |
          python3 - <<'PY'
          from stacklab.llm.catalog import CACHE_ROOT, cuda_runtime
          from stacklab.llm.source_runtime import build_runtime
          config = cuda_runtime()
          print(build_runtime(config, CACHE_ROOT/'runtime'/config['runtime_version']))
          PY
      - name: Show source-build diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from stacklab.llm.catalog import CACHE_ROOT, cuda_runtime
          log = CACHE_ROOT/'runtime'/cuda_runtime()['runtime_version']/'build.log'
          if log.is_file():
              print(log.read_text(encoding='utf-8', errors='replace')[-24000:])
          PY
