<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LARA 5: Modellvergleich und Live-Simulation">
  <title>LARA 5 · Modellvergleich</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>LARA 5 · Modellvergleich</h1>
      <details id="connection">
        <summary id="connection-status">Runner verbinden</summary>
        <form id="connect-form">
          <label>Runner-URL <input id="runner" inputmode="url" placeholder="Leer bei lokalem Runner" autocomplete="off"></label>
          <label>Sitzungsschlüssel <input id="key" type="password" autocomplete="off" required></label>
          <button type="submit" id="connect">Verbinden</button>
          <a href="https://github.com/carlo2004/Simulation-Neura-LARA-5/blob/main/docs/workbench.md#runner-in-google-colab">Colab-Setup</a>
        </form>
      </details>
    </header>

    <div class="toolbar">
      <label>Startszene <select id="task"></select></label>
      <button id="copy-prompt" type="button">Prompt A → B</button>
      <button class="primary" id="run" type="button" disabled>Beide starten</button>
      <button id="stop" type="button" hidden>Abbrechen</button>
    </div>
    <p id="notice" role="status" aria-live="polite">Runner verbinden, um Modelle live zu testen.</p>
    <div class="lanes" id="lanes"></div>

    <details class="secondary">
      <summary>Startkoordinaten und Python</summary>
      <ul id="objects"></ul>
      <label>Python-Programm <textarea id="code-input" spellcheck="false" rows="4" maxlength="64000"></textarea></label>
      <div class="row">
        <button id="run-code" type="button" disabled>Code ausführen</button>
        <button id="reference" type="button" disabled>Referenz ausführen</button>
      </div>
    </details>
    <details class="secondary">
      <summary>Aufnahmen und Berichte</summary>
      <div class="row">
        <label>Aufnahme <select id="replays"></select></label>
        <button id="play" type="button">Abspielen</button>
        <button id="export" type="button" disabled>Letzten Lauf speichern</button>
        <label class="file-button">Bericht öffnen <input id="import" type="file" accept="application/json,.json"></label>
        <a href="proof/manifest.json">Prüfbericht</a>
      </div>
      <video id="proof-player" controls playsinline preload="none" poster="lara-start.webp" aria-label="LARA-5-Aufnahme"></video>
    </details>
  </main>

  <template id="lane-template">
    <article class="lane">
      <header><h2 class="lane-title"></h2><span class="lane-state">Bereit</span></header>
      <label>Modell <select class="model" disabled></select></label>
      <label>Prompt <textarea class="prompt" rows="3" maxlength="4000"></textarea></label>
      <button class="start" type="button" disabled></button>
      <div class="viewport">
        <img class="frame" src="lara-start.webp" alt="LARA 5 in MuJoCo">
        <span class="frame-label">Referenzbild</span>
        <span class="clock">—</span>
      </div>
      <dl class="metrics">
        <div><dt>Ziel</dt><dd class="score">—</dd></div>
        <div><dt>Tokens/s</dt><dd class="rate">—</dd></div>
        <div><dt>Generierung</dt><dd class="duration">—</dd></div>
      </dl>
      <details class="output"><summary>Programm und Ergebnis</summary><p class="feedback"></p><pre class="program"></pre></details>
    </article>
  </template>
</body>
</html>
