[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lara-stack-lab"
dynamic = ["version", "dependencies"]
description = "Prompt2Robo model comparison on the LARA 5 MuJoCo simulation"
requires-python = ">=3.12"

[project.scripts]
stacklab = "stacklab.__main__:main"

[tool.setuptools.packages.find]
include = ["stacklab*"]

[tool.setuptools.dynamic]
version = {attr = "stacklab.__version__"}
dependencies = {file = ["requirements.txt"]}
